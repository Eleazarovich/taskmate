services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: taskmate
      POSTGRES_USER: taskmate
      POSTGRES_PASSWORD: taskmate
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskmate -d taskmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TASKMATE_DATABASE_URL: postgresql://taskmate:taskmate@postgres:5432/taskmate
    ports:
      - "${TASKMATE_APP_PORT:-8000}:8000"
    healthcheck:
      test:
        ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres-data:
